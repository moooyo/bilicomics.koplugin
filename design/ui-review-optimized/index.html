<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BiliComics · UI Review</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#gallery" data-copy="skip"></a>
  <header class="masthead">
    <a class="brand" href="index.html" aria-label="BiliComics 界面审阅"><span class="brand-mark" aria-hidden="true">b.</span><span>BiliComics<small>KOReader / 原生界面审阅</small></span></a>
    <div class="masthead-actions"><span id="save-status" role="status"></span><button id="export" class="button" data-copy="export"></button></div>
  </header>
  <div class="workspace">
    <aside class="sidebar" aria-labelledby="navigation-title">
      <h2 id="navigation-title" class="eyebrow" data-copy="navigation"></h2>
      <nav id="groups" class="group-list" aria-labelledby="navigation-title"></nav>
      <div class="sidebar-section">
        <label class="field-label" for="language" data-copy="language"></label>
        <select id="language"><option value="zh_CN">简体中文</option><option value="en">English</option></select>
        <label class="field-label" for="resolution" data-copy="resolution"></label>
        <select id="resolution"><option value="600x800">600 × 800</option><option value="480x640">480 × 640</option><option value="720x960">720 × 960</option><option value="960x720">960 × 720</option></select>
      </div>
      <div class="sidebar-section review-key"><span class="eyebrow" data-copy="marks"></span><span><i class="status-dot improve"></i><span data-copy="improve"></span><b id="count-improve">0</b></span><span><i class="status-dot pass"></i><span data-copy="pass"></span><b id="count-pass">0</b></span><span><i class="status-dot discuss"></i><span data-copy="discuss"></span><b id="count-discuss">0</b></span></div>
      <p class="sidebar-foot" data-copy="storageNote"></p>
    </aside>
    <main id="main">
      <div class="page-heading"><div><p class="eyebrow" data-copy="eyebrow"></p><h1 id="page-title"></h1></div><div><a class="text-link" href="comparison.html">优化前后对照 ↗</a> · <a class="text-link" href="overview.png" target="_blank" rel="noopener" data-copy="overviewImage"></a></div></div>
      <p class="intro" data-copy="intro"></p>
      <div class="capture-info" id="capture-info"></div>
      <div class="toolbar">
        <div class="segmented" role="group" data-aria="viewFilter"><button data-view="overview" aria-pressed="true" data-copy="overview"></button><button data-view="all" aria-pressed="false" data-copy="all"></button><button data-view="state" aria-pressed="false" data-copy="states"></button></div>
        <div class="search-control"><label class="visually-hidden" for="search" data-copy="search"></label><input id="search" type="search" autocomplete="off" data-placeholder="searchPlaceholder"></div>
        <label class="visually-hidden" for="review-filter" data-copy="reviewFilter"></label><select id="review-filter"><option value="all" data-copy="allMarks"></option><option value="unreviewed" data-copy="unreviewed"></option><option value="improve" data-copy="improve"></option><option value="pass" data-copy="pass"></option><option value="discuss" data-copy="discuss"></option></select>
      </div>
      <div class="results-bar"><p id="results-count" role="status" aria-live="polite"></p><span data-copy="openHint"></span></div>
      <div id="gallery" class="gallery" tabindex="-1"></div>
      <div id="empty" class="empty-state" hidden><h2 data-copy="emptyTitle"></h2><p data-copy="emptyBody"></p><button id="clear-filters" class="button" data-copy="clearFilters"></button></div>
      <noscript><p>请启用 JavaScript 以浏览截图图集。也可以直接打开 screens 目录中的原始图片。</p></noscript>
      <footer class="page-footer"><span data-copy="footer"></span><span id="manifest-version"></span></footer>
    </main>
  </div>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-bar"><div class="viewer-index"><button id="previous" class="icon-button" data-aria="previous">←</button><span id="viewer-position"></span><button id="next" class="icon-button" data-aria="next">→</button></div><button id="close-viewer" class="button" data-copy="close"></button></div>
    <div class="viewer-body"><div class="viewer-image-area"><button id="image-zoom" class="image-zoom" data-aria="zoom"><img id="viewer-image" alt=""></button></div><aside class="review-panel"><p class="eyebrow" id="viewer-group"></p><h2 id="viewer-title"></h2><code id="viewer-id"></code><p class="viewer-meta" id="viewer-meta"></p><p class="viewer-source" data-copy="sourceNote"></p><div class="image-actions"><a id="original-link" class="text-link" target="_blank" rel="noopener" data-copy="original"></a><button id="zoom-button" class="text-button" data-copy="nativePixels"></button></div><fieldset class="review-status"><legend data-copy="reviewMark"></legend><label><input type="radio" name="review-status" value="unreviewed"><span data-copy="unreviewed"></span></label><label><input type="radio" name="review-status" value="improve"><i class="status-dot improve"></i><span data-copy="improve"></span></label><label><input type="radio" name="review-status" value="pass"><i class="status-dot pass"></i><span data-copy="pass"></span></label><label><input type="radio" name="review-status" value="discuss"><i class="status-dot discuss"></i><span data-copy="discuss"></span></label></fieldset><label class="field-label" for="review-note" data-copy="notes"></label><textarea id="review-note" rows="7" data-placeholder="notesPlaceholder"></textarea><p id="note-feedback" class="note-feedback" role="status"></p><p class="keyboard-hint" data-copy="keyboardHint"></p></aside></div>
  </dialog>
</body>
</html>
